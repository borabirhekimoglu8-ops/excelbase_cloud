<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="islandFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fd1e8" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#f47721" stop-opacity=".08"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Anatolia west coast -->
  <path filter="url(#glow)" fill="url(#islandFill)" stroke="#4fd1e8" stroke-opacity=".55" stroke-width="1.4"
    d="M620 80c40 30 70 90 78 160 8 70-6 140-18 210-10 58-28 110-22 168 6 55 34 98 48 150 12 44 8 92-18 120l-36-18c22-24 28-62 16-98-16-48-42-88-48-140-8-62 8-118 18-178 12-72 28-142 18-208-8-54-32-98-66-128z"/>
  <!-- Lesbos -->
