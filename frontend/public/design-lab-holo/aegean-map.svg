  <!-- Kos -->
  <path filter="url(#glow)" fill="url(#islandFill)" stroke="#7ee7f5" stroke-opacity=".75" stroke-width="1.3"
    d="M500 560c34 4 56 18 54 38-2 18-26 28-54 26-24-2-42-14-40-30 2-16 20-30 40-34z"/>
  <!-- Rhodes -->
  <path filter="url(#glow)" fill="url(#islandFill)" stroke="#f47721" stroke-opacity=".85" stroke-width="1.6"
