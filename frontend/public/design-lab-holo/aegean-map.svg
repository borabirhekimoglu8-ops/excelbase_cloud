  <path filter="url(#glow)" fill="url(#islandFill)" stroke="#7ee7f5" stroke-opacity=".55" stroke-width="1"
    d="M310 560c8 4 14 12 12 20-2 8-10 12-18 10-8-2-12-10-10-18 2-6 8-12 16-12z"/>
  <path filter="url(#glow)" fill="url(#islandFill)" stroke="#7ee7f5" stroke-opacity=".55" stroke-width="1"
    d="M340 590c10 2 16 10 14 18-2 8-12 12-20 10-8-2-12-10-10-18 2-6 8-12 16-10z"/>
